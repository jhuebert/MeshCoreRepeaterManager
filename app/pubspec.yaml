name: meshcore_repeater_manager
description: >-
  OTA firmware updates for MeshCore repeaters, over LoRa, from your phone.
publish_to: none

version: 1.1.1+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  flutter_blue_plus: ^1.35.3
  flutter_foreground_task: ^11.0.3
  flutter_file_dialog: ^3.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  http: ^1.2.2
  crypto: ^3.0.3

  mesh_protocol:
    path: ../packages/mesh_protocol
  device_link:
    path: ../packages/device_link
  companion_client:
    path: ../packages/companion_client
  ota_core:
    path: ../packages/ota_core
  wifi_ota_core:
    path: ../packages/wifi_ota_core
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Regenerate the platform icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
